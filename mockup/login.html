  <header class="header">

      <a href="login.html">ログイン</a>
      <a class="button" href="new.html">レシピを登録</a>
    </nav>
  </header>
  <main class="main">
    <div class="auth">
      <h1>ログイン</h1>
      <p class="info">レシピを登録するにはログインが必要です</p>
      <p class="note" style="margin:-0.5rem 0 1rem">※ 未ログインで「レシピを登録」を押して移動してきたときだけ表示</p>
      <form class="form" action="index.html">
        <label>メールアドレス<input type="email" required placeholder="you@example.com"></label>
        <label>パスワード<input type="password" required minlength="8" maxlength="15"></label>
        <button type="submit">ログイン</button>
      </form>
      <p class="switch">アカウントをお持ちでない方は <a href="signup.html">ユーザー登録</a></p>
    </div>

    <section class="state-example">
      <span class="state-label">状態例：認証に失敗したとき</span>
      <ul class="errors"><li>メールアドレスまたはパスワードが違います</li></ul>
    </section>
  </main>
