<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>レシピ編集 | レシピ帳（モック）</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="mock-bar"><strong>モック｜S-04 レシピ編集</strong><a href="index.html">S-01 一覧</a><a href="recipe.html">S-02 詳細</a><a href="new.html">S-03 登録</a><a href="edit.html" aria-current="page">S-04 編集</a><a href="signup.html">S-05 ユーザー登録</a><a href="login.html">S-06 ログイン</a><a href="mypage.html">S-07 マイページ</a></div>
  <header class="header">
    <a class="logo" href="index.html">🍳 レシピ帳</a>
    <nav>
      <a href="index.html">一覧</a>
      <a href="mypage.html">マイページ</a>
      <span class="user-name">山田さん</span>
      <a href="login.html">ログアウト</a>
      <a class="button" href="new.html">レシピを登録</a>
    </nav>
  </header>
  <main class="main">
    <h1>レシピを編集</h1>
    <form class="form" action="recipe.html">
      <label>
        <span>料理名 <span class="required">必須</span></span>
        <input type="text" maxlength="50" required value="親子丼" placeholder="例: 親子丼">
        <span class="hint">50文字以内</span>
      </label>
      <label>
        ひとこと説明
        <textarea rows="2" maxlength="200" placeholder="例: 甘めのつゆでふわとろに仕上げる定番丼">甘めのつゆでふわとろに仕上げる定番丼。</textarea>
        <span class="hint">200文字以内</span>
      </label>
      <div class="row">
        <label>
          カテゴリ
          <select>
            <option value="">選択してください</option>
            <option selected>主菜</option>
            <option>副菜</option>
            <option>汁物</option>
            <option>デザート</option>
          </select>
        </label>
        <label>
          調理時間（分）
          <input type="number" min="1" max="999" value="20" placeholder="1〜999">
        </label>
        <label>
          何人分
          <input type="number" min="1" max="20" value="2" placeholder="1〜20">
        </label>
      </div>
      <label>
        完成写真（1枚）
        <input type="file" accept="image/*">
        <span class="hint">未設定のときはダミー画像を表示します</span>
      </label>

      <fieldset>
        <legend>材料</legend>
        <div class="line"><input type="text" maxlength="50" value="鶏もも肉" placeholder="材料名" aria-label="材料名"><input class="short" type="text" maxlength="30" value="200g" placeholder="分量" aria-label="分量"><button type="button" class="link">削除</button></div>
        <div class="line"><input type="text" maxlength="50" value="卵" placeholder="材料名" aria-label="材料名"><input class="short" type="text" maxlength="30" value="3個" placeholder="分量" aria-label="分量"><button type="button" class="link">削除</button></div>
        <div class="line"><input type="text" maxlength="50" value="玉ねぎ" placeholder="材料名" aria-label="材料名"><input class="short" type="text" maxlength="30" value="1/2個" placeholder="分量" aria-label="分量"><button type="button" class="link">削除</button></div>
        <div class="line"><input type="text" maxlength="50" value="めんつゆ（3倍濃縮）" placeholder="材料名" aria-label="材料名"><input class="short" type="text" maxlength="30" value="大さじ3" placeholder="分量" aria-label="分量"><button type="button" class="link">削除</button></div>
        <div class="line"><input type="text" maxlength="50" value="ごはん" placeholder="材料名" aria-label="材料名"><input class="short" type="text" maxlength="30" value="2杯分" placeholder="分量" aria-label="分量"><button type="button" class="link">削除</button></div>
        <button type="button" class="secondary">＋ 材料を追加</button>
      </fieldset>

      <fieldset>
        <legend>手順</legend>
        <div class="line"><span class="step-no">1</span><textarea rows="2" maxlength="500" aria-label="手順1">鶏肉は一口大に、玉ねぎは薄切りにする。</textarea><button type="button" class="link">削除</button></div>
        <div class="line"><span class="step-no">2</span><textarea rows="2" maxlength="500" aria-label="手順2">フライパンにめんつゆと水 100ml を入れ、鶏肉と玉ねぎを中火で煮る。</textarea><button type="button" class="link">削除</button></div>
        <div class="line"><span class="step-no">3</span><textarea rows="2" maxlength="500" aria-label="手順3">溶き卵を回し入れ、半熟になったら火を止めてごはんにのせる。</textarea><button type="button" class="link">削除</button></div>
        <button type="button" class="secondary">＋ 手順を追加</button>
        <span class="hint">手順番号は並び順で自動的に振り直されます</span>
      </fieldset>

      <div class="actions" style="margin-top:0.5rem">
        <button type="submit">更新する</button>
        <a href="recipe.html" class="button secondary">キャンセル</a>
      </div>
    </form>

    <section class="state-example">
      <span class="state-label">状態例：投稿者本人以外が開いたとき</span>
      <p>本人以外は編集できない（改ざん防止）。編集フォームは表示せず、そのレシピの詳細画面（S-02）へ移動する。</p>
      <p class="note">※ 画面で止めるだけでなく、API でも本人以外の更新・削除を拒否する</p>
    </section>
  </main>
</body>
</html>
